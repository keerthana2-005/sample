<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>JavaScript Snake Game</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }

    nav {
      background-color: #007BFF;
      padding: 15px 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-top: 30px;
    }

    #gameSpeed,
    #gameStart {
      margin: 10px;
      padding: 8px;
      font-size: 16px;
    }

    #gameStart {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }

    #gameStart:hover {
      background-color: #218838;
    }

    canvas#gameArea {
      display: block;
      margin: 30px auto;
      border: 2px solid #000;
      background-color: #fff;
    }

    .controls {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="css-info.html">CSS Info</a>
  </nav>

  <h1>Snake Game</h1>

  <div class="controls">
    Speed:
    <input type="number" id="gameSpeed" value="5" min="1" max="9" step="1" />
    <input type="button" value="Start" id="gameStart" />
  </div>

  <canvas id="gameArea"></canvas>

  <script src="app.js"></script>
</body>

</html>
